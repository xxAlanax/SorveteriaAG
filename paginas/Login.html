<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&G Sorveteria</title>
    <link rel="icon" type="imagem/png" href="../imagens/Logo.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="cabecalho">
        
        <img class="logo" src="../imagens/Logo.png" alt="logo da A&G sorveteria">
        
        <nav class="navegacao">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="Cardapio.html">Cardápio</a></li>
                <li><a href="Sobre.html">Sobre</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <main class="aba_login">
        <section class="login">
            <h1>Fazer Login</h1>

        <form class="fazer_login">
            <fieldset>
                <legend>Dados da Conta</legend>
                <label for="email">Email:</label>
                <input id="email" name="email" type="email" placeholder="Digite seu email" required>

                <label for="senha">Senha:</label>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha" minlength="4" required>
            </fieldset>

            <button type="submit" class="botao">Entrar</button>

        </form>
            <div class="cadastre">
                <p>Não possui conta?</p>
                <a href="Cadastro.html">Cadastra-se</a>
            </div>
        </section>
    </main>
    
    <footer class="rodape">
        <img class="logo" src="../imagens/Logo.png" alt="logo da A%G sorveteria">

        <section>
            <h2>Localização</h2>
            <p>Rua: Suenia de Melo - 43</p>
            <p>Bairro: Diniz</p>
        </section>

        <section>
            <h2>Contato</h2>
            <p>Telefone: 1111-1111</p>
            <p>Email: a&g@sorveteria.com</p>
        </section>

        <a class="botao" href="Trabalhe.html">Trabalhe Conosco</a>
    </footer>
</body>
</html>
